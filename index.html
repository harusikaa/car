<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111820"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Drive Collection"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg"><title>Drive Collection</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}*{box-sizing:border-box}body{margin:0;background:#10151d;color:#f6f7f9}main{max-width:600px;margin:auto;padding:22px 18px 110px}h1{font-size:26px;margin:0}small,.muted{color:#abb7c7}.eyebrow{font-size:11px;letter-spacing:2px;color:#d3ad6d}section{background:#1d2733;border-radius:18px;padding:18px;margin:18px 0}.metric{font-size:36px;font-weight:750;margin:8px 0}.gold{color:#e8c184}.puzzle{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:linear-gradient(125deg,#344050,#121820);margin:15px 0}.puzzle img{width:100%;height:100%;object-fit:cover}.puzzle .placeholder{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#c2cbd7;padding:20px}.tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}.tile{display:grid;place-items:center;background:#080b0fe9;border:1px solid #252c36;color:#d4d9df}.bar{height:8px;background:#3a4553;border-radius:20px;overflow:hidden}.bar div{height:100%;background:#d9af69;transition:width .2s}button{border:0;border-radius:12px;padding:13px 17px;background:#c69b58;color:#10151d;font-weight:700;font-size:15px;cursor:pointer}button.secondary{background:#344253;color:white}button:disabled{opacity:.45}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.record{padding:14px 0;border-bottom:1px solid #3b4652}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#1a2430;border-top:1px solid #394453;padding:10px 8px calc(10px + env(safe-area-inset-bottom))}.tabs button{background:transparent;color:#c4ced9;flex:1;max-width:200px;font-size:13px}.tabs button.active{color:#f0c37d}.hidden{display:none}.note{font-size:12px;line-height:1.6;color:#b7c3d0}.car-card{padding:14px;border-radius:13px;background:#283340;margin-top:12px}input[type=file]{width:100%;font-size:13px;margin-top:9px}label{font-size:13px;color:#c6d0dd}
</style></head><body><main><header><div class="eyebrow">DRIVE COLLECTION</div><h1>My Drive 🚗</h1><small>走るほど、憧れの車が姿を現す</small></header>
<div id="drive"><section><div class="muted">GPS累計移動距離（この端末）</div><div class="metric" id="total">0.00 km</div><div class="muted" id="next">次のピースまで 10.00 km</div></section><section><div class="row"><b id="carname">マセラティ・ギブリ</b><b class="gold" id="pieces">0 / 9</b></div><div class="puzzle"><img id="carimage" alt="車の画像"><div class="placeholder" id="placeholder">車の画像は「ガレージ」から登録できます</div><div class="tiles" id="tiles"></div></div><div class="bar"><div id="progress" style="width:0%"></div></div></section><section><b>GPS計測</b><div class="metric" id="trip">0.00 km</div><div class="muted" id="status">停止中</div><div class="actions"><button id="start">GPS計測開始</button><button class="secondary" id="stop" disabled>GPS計測停止</button></div><p class="note">画面を開いている間だけ計測します。徒歩・電車も記録対象です。運転中は操作しないでください。</p></section><section><div class="row"><b>🛠 テストモード</b><input type="checkbox" id="testmode" aria-label="テストモード"></div><div id="testcontrols" class="hidden"><p>テスト距離：<b id="testdistance">0 km</b></p><div class="actions"><button id="addtest">+10 km</button><button class="secondary" id="resettest">テスト距離をリセット</button></div><p class="note">GPS累計距離や履歴は変更しません。</p></div></section></div>
<div id="garage" class="hidden"><section><h2>マイガレージ</h2><p class="note">端末内の画像を登録できます。登録画像はこのブラウザ内に保存されます。</p><div id="cars"></div></section></div>
<div id="history" class="hidden"><section><h2>ドライブ履歴</h2><div class="row"><span class="muted">保存済みのドライブ</span><b id="count">0 回</b></div><div id="records"></div></section></div></main>
<nav class="tabs"><button data-tab="drive" class="active">🚗 ドライブ</button><button data-tab="garage">🏎️ ガレージ</button><button data-tab="history">🕒 履歴</button></nav>
<script>
const cars=[{name:'マセラティ・ギブリ',key:'ghibli'},{name:'フェラーリ 488 GTB',key:'ferrari'}];
const $=id=>document.getElementById(id);const read=(key,fallback)=>{try{const s=localStorage.getItem(key);return s===null?fallback:JSON.parse(s)}catch{return fallback}};
let total=read('dc_total',0),records=read('dc_records',[]),images=read('dc_images',{}),testMode=false,testDistance=0,watch=null,last=null,trip=0,startTime=null,active=false;
const save=()=>{localStorage.setItem('dc_total',JSON.stringify(total));localStorage.setItem('dc_records',JSON.stringify(records))};
const distance=(a,b)=>{const R=6371000,rad=Math.PI/180,dlat=(b.latitude-a.latitude)*rad,dlon=(b.longitude-a.longitude)*rad,x=Math.sin(dlat/2)**2+Math.cos(a.latitude*rad)*Math.cos(b.latitude*rad)*Math.sin(dlon/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))};
function render(){let d=testMode?testDistance:total,ci=Math.min(Math.floor(d/90),1),pieces=Math.min(Math.floor(Math.max(0,d-ci*90)/10),9),car=cars[ci];$('total').textContent=total.toFixed(2)+' km';$('trip').textContent=trip.toFixed(2)+' km';$('carname').textContent=car.name;$('pieces').textContent=pieces+' / 9';$('progress').style.width=(pieces/9*100)+'%';$('next').textContent=d>=180?'全車完成！':'次のピースまで '+(10-(d%10)).toFixed(2)+' km';$('testdistance').textContent=testDistance.toFixed(0)+' km';$('testcontrols').classList.toggle('hidden',!testMode);$('carimage').src=images[car.key]||(car.key+'.jpg');$('carimage').style.display='block';$('placeholder').style.display='none';$('tiles').innerHTML=Array.from({length:9},(_,i)=>'<div class="'+(i<pieces?'':'tile')+'">'+(i<pieces?'':'🔒')+'</div>').join('');$('count').textContent=records.length+' 回';$('records').innerHTML=records.length?records.map(r=>'<div class="record"><div class="row"><b>'+new Date(r.date).toLocaleString('ja-JP')+'</b><b class="gold">'+r.km.toFixed(2)+' km</b></div><small>'+Math.round(r.seconds/60)+' 分</small></div>').join(''):'<p class="muted">まだ履歴がありません。</p>';
$('cars').innerHTML=cars.map((c,i)=>{const done=d>=(i+1)*90;return '<div class="car-card"><b>'+c.name+'</b><p class="muted">'+(done?'✓ 完成':'🔒 完成まであと '+Math.max(0,(i+1)*90-d).toFixed(1)+' km')+'</p>'+(done?'<img alt="'+c.name+'" src="'+(images[c.key]||(c.key+'.jpg'))+'" style="width:100%;border-radius:10px">':'')+'<label>画像を登録<input type="file" accept="image/*" data-car="'+c.key+'"></label></div>'}).join('');document.querySelectorAll('[data-car]').forEach(el=>el.addEventListener('change',loadImage));}
function loadImage(e){const file=e.target.files[0],key=e.target.dataset.car;if(!file)return;if(file.size>2*1024*1024){alert('画像が大きすぎます。2MB以下の画像を選んでください。');return}const reader=new FileReader();reader.onload=()=>{images[key]=reader.result;try{localStorage.setItem('dc_images',JSON.stringify(images));render()}catch{alert('画像の保存容量が足りません。小さい画像を使ってください。')}};reader.readAsDataURL(file)}
$('start').onclick=()=>{if(active)return;if(!navigator.geolocation){$('status').textContent='このブラウザはGPSに対応していません';return}active=true;trip=0;last=null;startTime=Date.now();$('status').textContent='位置情報の許可を確認中';$('start').disabled=true;$('stop').disabled=false;watch=navigator.geolocation.watchPosition(pos=>{const p=pos.coords;if(p.accuracy>50){$('status').textContent='GPS精度を確認中（誤差 '+Math.round(p.accuracy)+'m）';return}if(last){const meters=distance(last.coords,p),seconds=(pos.timestamp-last.time)/1000;if(seconds>0&&meters>=3&&meters<=200&&meters/seconds<=45){const km=meters/1000;trip+=km;total+=km;save()}}last={coords:{latitude:p.latitude,longitude:p.longitude},time:pos.timestamp};$('status').textContent='GPS計測中（精度 '+Math.round(p.accuracy)+'m）';render()},err=>{$('status').textContent='GPSエラー：'+err.message;active=false;$('start').disabled=false;$('stop').disabled=true;if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null},{enableHighAccuracy:true,maximumAge:0,timeout:20000})};
$('stop').onclick=()=>{if(!active)return;active=false;if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;if(trip>0){records.unshift({date:new Date(startTime).toISOString(),km:trip,seconds:(Date.now()-startTime)/1000});save()}$('status').textContent='停止中';$('start').disabled=false;$('stop').disabled=true;render()};
$('testmode').onchange=e=>{testMode=e.target.checked;render()};$('addtest').onclick=()=>{testDistance+=10;render()};$('resettest').onclick=()=>{testDistance=0;render()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{for(const t of ['drive','garage','history'])$(t).classList.toggle('hidden',t!==b.dataset.tab);document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b))});render();
</script></body></html>
